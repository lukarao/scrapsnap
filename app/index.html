<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
		/>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<link rel="manifest" href="manifest.json" />
		<title>ScrapSnap</title>
		<link rel="stylesheet" href="styles/style.css" />
		<script type="module" src="scripts/main.js" defer></script>
	</head>

	<body>
		<!-- camera -->
		<div id="video-container">
			<video id="video" playsinline></video>
		</div>
		<canvas id="canvas" width="640" height="640" hidden></canvas>
		<button id="card">
			<div id="card-icon">
				<!-- <i data-lucide="{icon}"></i> -->
			</div>
			<div id="card-content">
				<!-- <h2>{name}</h2> -->
				<!-- <h3>{type}</h3> -->
			</div>
			<div id="card-link">
				<i data-lucide="chevron-right"></i>
			</div>
		</button>
		<div id="overlay-container">
			<div id="overlay"></div>
		</div>
		<div id="buttons">
			<button id="flashlight">
				<i data-lucide="flashlight"></i>
			</button>
			<button id="flip">
				<i data-lucide="refresh-cw"></i>
			</button>
			<button id="menu-open">
				<i data-lucide="menu"></i>
			</button>
		</div>

		<!-- menu -->
		<div id="menu">
			<button id="menu-close">
				<i data-lucide="chevron-left"></i>
			</button>
			<div>
				<div id="search">
					<i data-lucide="search"></i>
					<input
						type="text"
						id="search-input"
						placeholder="Search the trash database"
					/>
				</div>
				<div id="menu-list">
					<!-- <button class="card" onclick="getResult({res})"></button> -->
				</div>
			</div>
		</div>
	</body>
</html>
